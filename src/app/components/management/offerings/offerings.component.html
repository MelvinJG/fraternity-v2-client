<div class="container">
    <div class="page-header mb-4">
        <h1>
            <i class="fas fa-hand-holding-heart"></i>
            Ofrendas
        </h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a routerLink="/home">Inicio</a></li>
                <li class="breadcrumb-item"><a routerLink="/management">Gestiones</a></li>
                <li class="breadcrumb-item active">Ofrendas</li>
            </ol>
        </nav>
    </div>
    <div class="offering-form">
        <!-- Name input -->
        <mdb-form-control class="mb-4">
            <input mdbInput type="text" id="offeringName" name="name" class="form-control" autocomplete="off" required />
            <label mdbLabel class="form-label" for="offeringName">Nombre *</label>
        </mdb-form-control>

        <!-- Amount input -->
        <mdb-form-control class="mb-4">
            <input mdbInput type="number" id="offeringAmount" name="amount" class="form-control" autocomplete="off" required />
            <label mdbLabel class="form-label" for="offeringAmount">Cantidad (Q) *</label>
        </mdb-form-control>

        <div class="d-grid gap-2 col-6 mx-auto py-2 mt-3">
            <button class="btn btn-success btn-lg size-btn-primary" mdbRipple type="button">
                Guardar
            </button>
        </div>
    </div>
</div>
