@if (isOpen) {
<div class="alert-dialog-overlay">
    <div class="alert-dialog-backdrop" (click)="onCancel()"></div>
    <div class="alert-dialog-content">
        <div class="alert-dialog-header">
            <h3 class="alert-dialog-title">{{ title }}</h3>
            @if (description) {
            <p class="alert-dialog-description">{{ description }}</p>
            }
        </div>
        <div class="alert-dialog-footer">
            <button type="button" class="alert-dialog-btn alert-dialog-btn-cancel" (click)="onCancel()">
                {{ cancelLabel }}
            </button>
            <button type="button" class="alert-dialog-btn alert-dialog-btn-confirm" [ngClass]="'variant-' + variant"
                (click)="onConfirm()">
                {{ confirmLabel }}
            </button>
        </div>
    </div>
</div>
}
